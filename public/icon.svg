<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Chevron Neon Gradient -->
    <linearGradient id="chevron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- AI Sparkle / Orb Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d8b4fe"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Squircle Outer Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner Subtle Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="32" y1="160" x2="480" y2="160"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="352" x2="480" y2="352"/>
    <line x1="160" y1="32" x2="160" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="352" y1="32" x2="352" y2="480"/>
  </g>

  <!-- Ambient Internal Glow behind Chevron -->
  <circle cx="210" cy="256" r="110" fill="#00f2fe" opacity="0.12" filter="url(#neon-glow)"/>
  <circle cx="330" cy="270" r="100" fill="#a855f7" opacity="0.16" filter="url(#neon-glow)"/>

  <!-- Terminal Chevron Symbol ( > ) -->
  <path d="M 148 168 L 264 256 L 148 344" 
        fill="none" 
        stroke="url(#chevron-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>

  <!-- AI Neural Orb / Core Sparkle -->
  <g filter="url(#orb-glow)">
    <!-- Central Glowing Core -->
    <circle cx="336" cy="268" r="42" fill="url(#sparkle-grad)"/>
    <circle cx="336" cy="268" r="18" fill="#ffffff" opacity="0.9"/>

    <!-- Orbital Ring 1 -->
    <ellipse cx="336" cy="268" rx="72" ry="24" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="14 8" transform="rotate(-28 336 268)"/>
    
    <!-- Orbital Ring 2 -->
    <ellipse cx="336" cy="268" rx="64" ry="22" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 6" transform="rotate(40 336 268)"/>
  </g>

  <!-- Terminal Underscore Cursor ( _ ) with AI Pulse -->
  <line x1="260" y1="344" x2="356" y2="344" 
        stroke="#38bdf8" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#neon-glow)"/>

  <!-- Four-Pointed AI Sparks -->
  <!-- Top Spark -->
  <path d="M 370 148 Q 370 170 392 170 Q 370 170 370 192 Q 370 170 348 170 Q 370 170 370 148 Z" fill="#ffffff" opacity="0.85" filter="url(#neon-glow)"/>

  <!-- Mini Spark -->
  <path d="M 160 130 Q 160 142 172 142 Q 160 142 160 154 Q 160 142 148 142 Q 160 142 160 130 Z" fill="#38bdf8" opacity="0.75"/>
</svg>
